name: build
on: [push, pull_request]
jobs:
  golangci:
    name: Lint
    runs-on: ubuntu-latest
    # Prevent duplicate builds on internal PRs.
    if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name != github.repository
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v7
        with:
          # Must not be newer than the Go version golangci-lint is built with.
          go-version: "1.26"
      - name: golangci-lint
        uses: golangci/golangci-lint-action@v9
        with:
          version: v2.14.0
          args: --timeout 3m0s --verbose
  build:
    name: Test with Go ${{ matrix.go-version }} Redis ${{ matrix.redis-version }} Valkey ${{ matrix.valkey-version }}
    runs-on: ubuntu-latest
    # Prevent duplicate builds on internal PRs.
    if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name != github.repository
    strategy:
      matrix:
        go-version: ["1.26", "1.27"]
        redis-version: [7, 8]
        valkey-version: [8, 9]
    steps:
      - name: Install Go
        uses: actions/setup-go@v7
        with:
          go-version: ${{ matrix.go-version }}

      - name: Checkout code
        uses: actions/checkout@v6

      - name: Start services
        env:
          REDIS_VERSION: ${{ matrix.redis-version }}
          VALKEY_VERSION: ${{ matrix.valkey-version }}
        run: docker compose up -d --wait

      - name: Test
        run: |
          (while true; do echo "== $(date -u +%T)"; free -m; ps -eo pid,rss,vsz,args --sort=-rss | head -6; sleep 30; done) &
          monitor=$!
          go test -v -race -tags integration -timeout 7m -p 1 . ; status=$?
          kill $monitor
          exit $status

      - name: Upload code coverage to codecov
        if: matrix.go-version == '1.27' && matrix.redis-version == 8 && matrix.valkey-version == 9
        uses: codecov/codecov-action@v4
        with:
          file: ./coverage.out
          token: ${{ secrets.CODECOV_TOKEN }}
