name: build
on: [push, pull_request]
jobs:
  golangci:
    name: Lint
    runs-on: ubuntu-latest
    # Prevent duplicate builds on internal PRs.
    if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name != github.repository
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v7
        with:
          # Must not be newer than the Go version golangci-lint is built with.
          go-version: "1.26"
      - name: golangci-lint
        uses: golangci/golangci-lint-action@v9
        with:
          version: v2.14.0
          args: --timeout 3m0s --verbose
  build:
    name: Test with Go ${{ matrix.go-version }} Redis ${{ matrix.redis-version }} Valkey ${{ matrix.valkey-version }}
    runs-on: ubuntu-latest
    # Prevent duplicate builds on internal PRs.
    if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name != github.repository
    strategy:
      matrix:
        go-version: ["1.26", "1.27"]
        redis-version: [7, 8]
        valkey-version: [8, 9]
    steps:
      - name: Install Go
        uses: actions/setup-go@v7
        with:
          go-version: ${{ matrix.go-version }}

      - name: Checkout code
        uses: actions/checkout@v6

      - name: Start services
        env:
          REDIS_VERSION: ${{ matrix.redis-version }}
          VALKEY_VERSION: ${{ matrix.valkey-version }}
        run: docker compose up -d --wait

      - name: Test root package
        run: go test -v -race -tags integration -coverprofile=coverage.out .

      - name: Test other packages
        run: go test -v -race -tags integration -coverprofile=coverage_packages.out $(go list ./... | grep -v /_examples/ | grep -v -x github.com/centrifugal/centrifuge)

      - name: Upload code coverage to codecov
        if: matrix.go-version == '1.27' && matrix.redis-version == 8 && matrix.valkey-version == 9
        uses: codecov/codecov-action@v4
        with:
          files: ./coverage.out,./coverage_packages.out
          token: ${{ secrets.CODECOV_TOKEN }}
